name: meme-scanner

# Runs the scan on GitHub's machines, so it keeps going with your laptop off.
# GitHub's cron is best-effort: expect drift, and skipped slots when they are busy.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # the "Run workflow" button, for testing
  push:
    branches: [main]        # a push scans immediately - handy for testing a change
    paths-ignore:
      - 'track.json'        # the record committing itself must not start a scan
      - 'README.md'

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write        # so the track record can be committed back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Carry the 24h "already alerted" list between runs so you are not told
      # about the same token every quarter of an hour.
      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: state.json          # dedupe only - the record lives in git, not here
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      # start from the committed record, not from whatever this runner last saw
      - name: Sync the track record
        run: git pull --rebase --autostash origin main || true

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      # So /status and /scan still answer you while the laptop is off - the reply
      # arrives on the next run, so within about 15 minutes.
      - name: Answer Telegram commands
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_commands.py --once

      # The track record is the point of the whole thing, so it lives in git rather
      # than only in a cache that expires - visible, durable, and one copy.
      - name: Commit the track record
        if: always()
        run: |
          if [ -n "$(git status --porcelain track.json)" ]; then
            git config user.name "meme-scanner"
            git config user.email "actions@github.com"
            git add track.json
            git commit -m "track: record update [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push skipped"
          else
            echo "no change to the record"
          fi

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: scanner-state-${{ github.run_id }}
